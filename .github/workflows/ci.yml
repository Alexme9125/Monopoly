name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm prune --omit=dev
      - run: npm run smoke:production

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - run: docker build --tag prism-days:ci .
      - run: docker run --detach --name prism-days-ci --publish 127.0.0.1:18787:8787 prism-days:ci
      - name: Wait for container health
        run: |
          for attempt in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' prism-days-ci)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then docker logs prism-days-ci; exit 1; fi
            sleep 1
          done
          docker logs prism-days-ci
          exit 1
      - run: npm run smoke:production -- http://127.0.0.1:18787
      - if: failure()
        run: docker logs prism-days-ci
      - if: always()
        run: docker rm --force prism-days-ci || true
